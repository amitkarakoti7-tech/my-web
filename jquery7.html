<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.0-beta.1/jquery-ui.min.js"
        integrity="sha256-eTKBotE66yiuQ4Th2m+9M00ivksRSCZHlphWprTOFls=" crossorigin="anonymous"></script>
</head>
    <style>
        #main {
            width: 80%;
            height: 500px;
            margin: auto;
            overflow: hidden;
            box-shadow: 10px 10px 01px 10px gray;

        }

        .pic img {
            width: 100%;
            height: 500px;
            position: relative;
            top: 0px;
            left: 0px;

        }

        .big-blue {
            width: 100%;
            height: 0px;
            background-color: #00f;
        }
    </style>


<body>
    <script>
        var c = 1
        var t = 0
        $(document).ready(function()
    {
        setInterval(function runb()
    {

        $("#pic"+c).toggle("explode");

        if((c<=3)&&(t==0))
    {
        $("#pic"+c).addClass("big-blue",1000,"easeOutBounce");
        c++
    }
    else
    {
        t=1
    }
    if((c>=1)&&(t==1))
    {
        $("#pic"+c).removeClass("big+blue",1000,"easeOutBounce");
        c--
    }
    else
    {
        t=0
    }
    document.title = c
},1000)
})
    </script>

    <div id="main">
        <div id="pic1" class="pic">
            <img src="images/1.jpg" alt="">
        </div>
        <div id="pic2" class="pic">
            <img src="images/2.jpg" alt="">
        </div>
        <div id="pic3" class="pic">
            <img src="images/3.jpg" alt="">
        </div>
        <div id="pic4" class="pic">
            <img src="images/4.jpg" alt="">
        </div>
    </div>

</body>

</html>
