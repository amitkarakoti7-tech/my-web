    <style>
        #main {
            width: 80%;
            height: 500px;
            margin: auto;
            overflow: hidden;
            box-shadow: 10px 10px 10px 10px gray;

        }

        .pic img {
            width: 100%;
            height: 500px;
            position: relative;
            top: 0%;
            left: 0%;
        }
    </style>
</head>

<body>

    <script>
        var c = 0
        var t = 0
        $(document).ready(function () {
            setInterval(function runb() {
                $("#pic" + c).slideToggle(1000)
                if ((c <= 2) && (t == 0)) {
                    c++
                }
                else {
                    t = 1
                }
                if ((c >= 1) && (t == 1)) {
                    c--
                }
                else {
                    t = 0
                }
            },1000)
        })
    </script>

    <div id="main">
        <div id="pic1" class="pic">
            <img src="images/1.jpg" alt="">
        </div>
        <div id="pic2" class="pic">
            <img src="images/2.jpg" alt="">
        </div>
        <div id="pic3" class="pic">
            <img src="images/3.jpg" alt="">
        </div>
        <div id="pic4" class="pic">
            <img src="images/4.jpg" alt="">
        </div>
    </div>
